# Tests and builds every push; for a version tag (v…) the exe is attached to that tag's release,
# so the download provably comes from the tagged source.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # attach the exe to the release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (GNU toolchain)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Checksum
        run: (Get-FileHash target\release\Scratchpad.exe -Algorithm SHA256).Hash

      - uses: actions/upload-artifact@v4
        with:
          name: Scratchpad
          path: target/release/Scratchpad.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title "Scratchpad $env:GITHUB_REF_NAME" --generate-notes
          }
          gh release upload $env:GITHUB_REF_NAME target\release\Scratchpad.exe --clobber
